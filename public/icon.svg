<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>
  <!-- 日历顶部 -->
  <rect x="112" y="120" width="288" height="48" rx="8" ry="8" fill="white" opacity="0.9"/>
  <rect x="112" y="160" width="288" height="200" rx="8" ry="8" fill="white" opacity="0.95"/>
  <!-- 日历环 -->
  <rect x="144" y="104" width="24" height="48" rx="6" ry="6" fill="#1e40af"/>
  <rect x="344" y="104" width="24" height="48" rx="6" ry="6" fill="#1e40af"/>
  <!-- 四象限分割线 -->
  <line x1="256" y1="180" x2="256" y2="340" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="140" y1="260" x2="372" y2="260" stroke="#cbd5e1" stroke-width="3"/>
  <!-- 四象限色块 -->
  <rect x="140" y="180" width="113" height="77" rx="4" fill="#fecaca" opacity="0.8"/>
  <rect x="259" y="180" width="113" height="77" rx="4" fill="#fed7aa" opacity="0.8"/>
  <rect x="140" y="263" width="113" height="77" rx="4" fill="#bfdbfe" opacity="0.8"/>
  <rect x="259" y="263" width="113" height="77" rx="4" fill="#bbf7d0" opacity="0.8"/>
  <!-- 圆点标记 -->
  <circle cx="196" cy="218" r="10" fill="#ef4444"/>
  <circle cx="316" cy="218" r="10" fill="#f97316"/>
  <circle cx="196" cy="301" r="10" fill="#3b82f6"/>
  <circle cx="316" cy="301" r="10" fill="#22c55e"/>
  <!-- 大白文字 -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">大白</text>
</svg>
